<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playa Del Rey Outages</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    font-size: 16px;
    line-height: 1.4;
  }
  .banner {
    font-size: 1.25rem;
    font-weight: bold;
    padding: 12px;
    border-radius: 8px;
    background: #eee;
  }
  .stale {
    color: #a00;
    font-weight: bold;
  }
  .last-check {
    color: #555;
  }
  ul {
    list-style: none;
    padding: 0;
  }
  .outage {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 12px;
    margin: 8px 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
</style>
</head>
<body>
  <p class="banner">No outages in Playa Del Rey</p>
  <p class="stale">Data may be stale — last successful check: never</p>
  
  <p class="last-check">Last checked: 9/21/2026 9:57 PM PDT</p>
</body>
</html>
