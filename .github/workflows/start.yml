name: Start

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days to monitor"
        required: true
        default: "7"

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run checker with --start
        run: python3 check.py --start "${{ github.event.inputs.days }}"

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet -- state.json index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json index.html
            git commit -m "Start monitoring"
            git push
          fi
